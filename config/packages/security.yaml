# Cadrage §5.1 / ASVS V2 : Argon2id explicite (jamais « auto »).
# Comptes clients et artisans : Identity (T-201). Formulaire de connexion, limitation et « se souvenir de moi » : T-204.
# Pare-feu d'administration isolé (admin.trouvemoi.com, 2FA TOTP, fournisseur distinct) : T-209.
security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: argon2id
            memory_cost: 65536   # 64 Mio (recommandation OWASP : ≥ 19 Mio)
            time_cost: 4

    providers:
        app_users:
            id: App\Identity\Infrastructure\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: app_users
            user_checker: App\Identity\Infrastructure\Security\UserChecker

    access_control: []

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: argon2id
                time_cost: 3
                memory_cost: 10
