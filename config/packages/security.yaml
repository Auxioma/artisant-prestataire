# Cadrage §5.1 / ASVS V2 : Argon2id explicite (jamais « auto »).
# Les fournisseurs d'utilisateurs réels (Identity) et le firewall admin isolé (admin.trouvemoi.com, 2FA TOTP)
# arrivent aux tickets T-201 / T-209 ; ce socle ne comporte encore aucune route authentifiée.
security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: argon2id
            memory_cost: 65536   # 64 Mio (recommandation OWASP : ≥ 19 Mio)
            time_cost: 4

    providers:
        users_in_memory: { memory: null }

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: users_in_memory

    access_control: []

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: argon2id
                time_cost: 3
                memory_cost: 10
