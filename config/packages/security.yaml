# Cadrage §5.1 / ASVS V2 : Argon2id explicite (jamais « auto »).
# Comptes clients et artisans : Identity (T-201). Formulaire de connexion, limitation et « se souvenir de moi » : T-204.
# Pare-feu d'administration isolé (admin.trouvemoi.com, 2FA TOTP, fournisseur distinct) : T-209.
security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: argon2id
            memory_cost: 65536   # 64 Mio (recommandation OWASP : ≥ 19 Mio)
            time_cost: 4

    providers:
        app_users:
            id: App\Identity\Infrastructure\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: app_users
            user_checker: App\Identity\Infrastructure\Security\UserChecker
            entry_point: form_login
            # A04 : formulaire, CSRF, redirection en liste blanche (LoginSuccessHandler) ; RG-045 : LoginSubscriber
            form_login:
                login_path: identity_login
                check_path: identity_login
                username_parameter: _username
                password_parameter: _password
                enable_csrf: true
                csrf_token_id: authenticate
                success_handler: App\Identity\Infrastructure\Security\LoginSuccessHandler
            # « Rester connecté » : cookie signé (empreinte + e-mail) — invalide dès un changement de mot de passe ou
            # d'adresse. Durée : auth.remember_me_days (30 j par défaut) ; la valeur ci-dessous en est le plafond (P-44).
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000
                remember_me_parameter: _remember_me
                signature_properties: ['password', 'email']
                secure: auto
                samesite: lax
            logout:
                path: identity_logout
                target: public_home
                enable_csrf: true
                csrf_token_id: logout
                invalidate_session: true

    access_control: []

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: argon2id
                time_cost: 3
                memory_cost: 10
