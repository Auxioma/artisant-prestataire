framework:
    cache:
        prefix_seed: trouvemoi/app
        app: cache.adapter.filesystem
        pools:
            # Paramètres administrables (ADR-0007) : invalidés sur SettingChanged.
            cache.settings:
                adapter: cache.app
            # Référentiel affiché sur toutes les pages (méga-menu) : invalidé sur les événements Catalog.
            cache.catalog:
                adapter: cache.app

when@prod:
    framework:
        cache:
            app: cache.adapter.redis
            default_redis_provider: '%env(REDIS_URL)%'

when@test:
    framework:
        cache:
            pools:
                cache.settings:
                    adapter: cache.adapter.array
                cache.catalog:
                    adapter: cache.adapter.array
                # Limites de débit isolées par exécution de tests (sinon l'état persiste et produit des 429).
                cache.rate_limiter:
                    adapter: cache.adapter.array
