framework:
    cache:
        prefix_seed: trouvemoi/app
        app: cache.adapter.filesystem
        pools:
            # Paramètres administrables (ADR-0007) : invalidés sur SettingChanged.
            cache.settings:
                adapter: cache.app
            # Référentiel affiché sur toutes les pages (méga-menu) : invalidé sur les événements Catalog.
            cache.catalog:
                adapter: cache.app
            # Sitemaps XML (BO12.3) : recalculés au plus toutes les heures.
            cache.sitemap:
                adapter: cache.app

when@prod:
    framework:
        cache:
            app: cache.adapter.redis
            default_redis_provider: '%env(REDIS_URL)%'

when@test:
    framework:
        cache:
            pools:
                cache.settings:
                    adapter: cache.adapter.array
                cache.catalog:
                    adapter: cache.adapter.array
                cache.sitemap:
                    adapter: cache.adapter.array
        # Limites de débit en test : voir services.yaml (when@test) — état propre à chaque noyau, conservé entre requêtes.
