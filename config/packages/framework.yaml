framework:
    secret: '%env(APP_SECRET)%'
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-host']

    # Cadrage §5.1 : cookies Secure, HttpOnly, SameSite=Lax (Strict pour le back-office, lot 2 / T-209).
    session:
        name: '%env(SESSION_COOKIE_NAME)%'
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax
        cookie_lifetime: 0
        gc_maxlifetime: 7200
        # T-906a : sessions dans Redis (clés « sf_s… », expiration = gc_maxlifetime), partagées entre les instances et
        # révocables d'un coup en cas d'incident (docs/incidents.md). Redis doit être en `maxmemory-policy noeviction` :
        # il porte aussi le cache et les files Messenger (docs/exploitation.md).
        handler_id: '%env(REDIS_URL)%'

    # Clients HTTP sortants : un client par service, hôte fixe, délais bornés (anti-SSRF — cadrage §5.3).
    http_client:
        scoped_clients:
            geo_api.client:
                base_uri: 'https://geo.api.gouv.fr'
                timeout: 30
                max_duration: 300
                headers: { Accept: 'application/json' }
            # Services tiers (cadrage §5.3) : hôte fixe, délais courts, aucune URL issue d'une saisie ; réseau privé
            # interdit par ExternalHttpClientsPass. Reprises automatiques uniquement sur les requêtes idempotentes.
            sirene.client:
                base_uri: 'https://api.insee.fr/api-sirene/3.11/'
                headers: { Accept: 'application/json', X-INSEE-Api-Key-Integration: '%env(INSEE_SIRENE_API_KEY)%' }
                timeout: 5
                max_duration: 10
                retry_failed: { max_retries: 2, delay: 2000 } # quota INSEE : 30 requêtes / minute
            geocoding.client:
                base_uri: 'https://data.geopf.fr/geocodage/'
                headers: { Accept: 'application/json' }
                timeout: 5
                max_duration: 10
                retry_failed: { max_retries: 2 }
            vies.client:
                base_uri: 'https://ec.europa.eu/taxation_customs/vies/rest-api/'
                headers: { Accept: 'application/json' }
                timeout: 10
                max_duration: 20
                retry_failed: { max_retries: 1 }
            turnstile.client:
                base_uri: 'https://challenges.cloudflare.com/turnstile/v0/'
                timeout: 5
                max_duration: 8
            # Stripe (T-602, ADR-0009) : transport de stripe-php ; reprises à la charge du worker (requêtes idempotentes).
            stripe.client:
                base_uri: 'https://api.stripe.com/'
                timeout: 10
                max_duration: 30
            hibp.client:
                base_uri: 'https://api.pwnedpasswords.com/'
                headers: { Add-Padding: 'true' } # réponses de taille uniforme (k-anonymat renforcé)
                timeout: 3
                max_duration: 5
            # Autocomplétion (ADR-0004) : délai court, le repli PostgreSQL prend le relais au-delà.
            meilisearch_search.client:
                base_uri: '%env(MEILISEARCH_URL)%'
                auth_bearer: '%env(MEILISEARCH_SEARCH_KEY)%'
                timeout: 1
                max_duration: 2
            meilisearch_admin.client:
                base_uri: '%env(MEILISEARCH_URL)%'
                auth_bearer: '%env(MEILISEARCH_ADMIN_KEY)%'
                timeout: 30

    http_method_override: false
    handle_all_throwables: true
    php_errors:
        log: true

when@prod:
    framework:
        session:
            cookie_secure: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
