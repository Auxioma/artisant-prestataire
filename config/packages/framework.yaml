framework:
    secret: '%env(APP_SECRET)%'
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-host']

    # Cadrage §5.1 : cookies Secure, HttpOnly, SameSite=Lax (Strict pour le back-office, lot 2 / T-209).
    session:
        name: '%env(SESSION_COOKIE_NAME)%'
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax
        cookie_lifetime: 0
        gc_maxlifetime: 7200

    # Clients HTTP sortants : un client par service, hôte fixe, délais bornés (anti-SSRF — cadrage §5.3).
    http_client:
        scoped_clients:
            geo_api.client:
                base_uri: 'https://geo.api.gouv.fr'
                timeout: 30
                max_duration: 300
                headers: { Accept: 'application/json' }
            # Autocomplétion (ADR-0004) : délai court, le repli PostgreSQL prend le relais au-delà.
            meilisearch_search.client:
                base_uri: '%env(MEILISEARCH_URL)%'
                auth_bearer: '%env(MEILISEARCH_SEARCH_KEY)%'
                timeout: 1
                max_duration: 2
            meilisearch_admin.client:
                base_uri: '%env(MEILISEARCH_URL)%'
                auth_bearer: '%env(MEILISEARCH_ADMIN_KEY)%'
                timeout: 30

    http_method_override: false
    handle_all_throwables: true
    php_errors:
        log: true

when@prod:
    framework:
        session:
            cookie_secure: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
