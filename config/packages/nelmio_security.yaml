# Cadrage §5.4 / SECURITY.md §4 : en-têtes de sécurité, CSP stricte à nonces, sans 'unsafe-inline'.
nelmio_security:
    clickjacking:
        paths:
            '^/.*': DENY

    content_type:
        nosniff: true

    referrer_policy:
        enabled: true
        policies:
            - 'strict-origin-when-cross-origin'

    permissions_policy:
        enabled: true
        policies:
            geolocation: ['self']
            camera: []
            microphone: []
            payment: ['self', 'https://js.stripe.com']
            usb: []
            interest_cohort: []

    csp:
        enabled: true
        hosts: []
        content_types: []
        enforce:
            level1_fallback: false
            browser_adaptive:
                enabled: false
            default-src: ['self']
            script-src: ['self', 'https://js.stripe.com', 'https://challenges.cloudflare.com']
            style-src: ['self']
            img-src: ['self', 'data:']
            font-src: ['self']
            connect-src: ['self', 'https://api.stripe.com']
            frame-src: ['https://js.stripe.com', 'https://hooks.stripe.com', 'https://challenges.cloudflare.com']
            frame-ancestors: ['none']
            base-uri: ['self']
            form-action: ['self', 'https://checkout.stripe.com']
            object-src: ['none']
            upgrade-insecure-requests: true
            block-all-mixed-content: false

# HTTPS forcé + HSTS en production uniquement (le développement local tourne en HTTP).
when@prod:
    nelmio_security:
        forced_ssl:
            enabled: true
            hsts_max_age: 31536000
            hsts_subdomains: true
            hsts_preload: false   # activer après validation du domaine (cadrage §5.4)
