# Conteneur de services — architecture modulaire (docs/ARCHITECTURE.md).
parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Les handlers Application n'utilisent aucun attribut framework : ils sont reliés aux bus par interface.
    _instanceof:
        App\Shared\Application\Bus\CommandHandler:
            tags: [{ name: messenger.message_handler, bus: command.bus }]
        App\Shared\Application\Bus\QueryHandler:
            tags: [{ name: messenger.message_handler, bus: query.bus }]
        App\Shared\Application\Bus\EventHandler:
            tags: [{ name: messenger.message_handler, bus: event.bus }]

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/*/Domain/'
            - '../src/*/Application/Command/*/*Command.php'
            - '../src/*/Application/Query/*/*Query.php'
            - '../src/Shared/Application/Settings/{SettingDefinition,InvalidSettingValue}.php'
            - '../src/Catalog/Application/Geo/{RegionRecord,DepartmentRecord,CommuneRecord,CommuneRow,ImportReport}.php'
            - '../src/Catalog/Infrastructure/Geo/{GeoApiGouvSource,JsonFileGeoSource,GeoApiPayloadParser}.php'
            - '../src/Search/Application/Port/{JobDocument,PlaceDocument,SearchUnavailable}.php'
            - '../src/Search/Application/Query/{Autocomplete,Suggestions}.php'

    # Ports du noyau partagé
    App\Shared\Domain\Time\Clock: '@App\Shared\Infrastructure\Time\SystemClock'
    App\Shared\Domain\Identifier\IdGenerator: '@App\Shared\Infrastructure\Identifier\UuidV7Generator'
    App\Shared\Application\Bus\CommandBus: '@App\Shared\Infrastructure\Messenger\MessengerCommandBus'
    App\Shared\Application\Bus\QueryBus: '@App\Shared\Infrastructure\Messenger\MessengerQueryBus'
    App\Shared\Application\Bus\EventBus: '@App\Shared\Infrastructure\Messenger\OutboxEventBus'
    App\Shared\Application\Transaction\TransactionManager: '@App\Shared\Infrastructure\Persistence\DbalTransactionManager'
    App\Shared\Application\Security\IpAnonymizer: '@App\Shared\Infrastructure\Security\HmacIpAnonymizer'
    App\Shared\Application\Settings\SettingsProvider: '@App\Administration\Infrastructure\Settings\DbalSettingsProvider'

    # Ports du module Administration
    App\Administration\Application\Port\SettingStore: '@App\Administration\Infrastructure\Settings\DbalSettingStore'
    App\Shared\Application\Audit\AuditTrail: '@App\Administration\Infrastructure\Audit\DbalAuditTrail'

    # Ports du module Catalog
    App\Catalog\Domain\Category\CategoryRepository: '@App\Catalog\Infrastructure\Doctrine\Repository\DoctrineCategoryRepository'
    App\Catalog\Domain\Job\JobRepository: '@App\Catalog\Infrastructure\Doctrine\Repository\DoctrineJobRepository'
    App\Catalog\Application\Port\JobUsageCounter: '@App\Catalog\Infrastructure\InterimJobUsageCounter'
    App\Catalog\Application\Geo\Port\GeoReferentialStore: '@App\Catalog\Infrastructure\Geo\DbalGeoReferentialStore'
    App\Catalog\Application\Geo\Port\GeoReferentialSourceFactory: '@App\Catalog\Infrastructure\Geo\GeoSourceFactory'
    App\Catalog\UI\Twig\CatalogExtension:
        arguments: { $catalogCache: '@cache.catalog' }
    App\Catalog\Infrastructure\Cache\InvalidateMainCategoriesCache:
        arguments: { $catalogCache: '@cache.catalog' }

    # Ports du module Content
    App\Content\Application\Port\RedirectStore: '@App\Content\Infrastructure\Redirect\DbalRedirectStore'

    # Ports du module Search
    App\Search\Application\Port\AutocompleteIndex: '@App\Search\Infrastructure\Meilisearch\MeilisearchAutocompleteIndex'

    # Ports du module Identity
    App\Identity\Application\Port\ConsentLog: '@App\Identity\Infrastructure\Consent\DbalConsentLog'

    App\Shared\Infrastructure\Messenger\MessengerCommandBus:
        arguments: { $bus: '@command.bus' }
    App\Shared\Infrastructure\Messenger\MessengerQueryBus:
        arguments: { $bus: '@query.bus' }

    App\Shared\Infrastructure\Messenger\OutboxEventBus:
        arguments:
            $messengerSerializer: '@messenger.transport.symfony_serializer'
    App\Shared\Infrastructure\Messenger\OutboxRelay:
        arguments:
            $messengerSerializer: '@messenger.transport.symfony_serializer'
            $eventBus: '@event.bus'

    App\Administration\Infrastructure\Settings\DbalSettingsProvider:
        arguments:
            $settingsCache: '@cache.settings'
    App\Administration\Infrastructure\Settings\InvalidateSettingsCache:
        arguments:
            $settingsCache: '@cache.settings'

# Points d'entrée applicatifs accessibles aux tests d'intégration (aucun effet hors environnement test).
when@test:
    services:
        test.command_bus:
            alias: App\Shared\Application\Bus\CommandBus
            public: true
        test.query_bus:
            alias: App\Shared\Application\Bus\QueryBus
            public: true
