when@test:
    services:
        # Prestataire de paiement : double en mémoire, jamais d'appel réseau en test (T-602).
        App\Billing\Application\Port\PaymentGateway: '@App\Billing\Infrastructure\Payment\InMemoryPaymentGateway'
        App\Billing\Infrastructure\Payment\InMemoryPaymentGateway:
            public: true
        test.command_bus:
            alias: App\Shared\Application\Bus\CommandBus
            public: true
        test.query_bus:
            alias: App\Shared\Application\Bus\QueryBus
            public: true
        # Dépôt des devis : sans consommateur avant les cas d'usage du lot 5 (T-502, T-504).
        test.quote_repository:
            alias: App\Quote\Domain\Quote\QuoteRepository
            public: true
        # Pipeline de fichiers : conservé dans le conteneur de test avant ses premiers usages (T-207, T-402).
        test.storage.uploader:
            alias: App\Shared\Application\Storage\FileUploader
            public: true
        test.storage.reader:
            alias: App\Shared\Application\Storage\FileReader
            public: true
        test.storage.shredder:
            alias: App\Shared\Application\Storage\FileShredder
            public: true
        test.storage.object_storage:
            alias: App\Shared\Application\Storage\Port\ObjectStorage
            public: true
        test.storage.quarantine:
            alias: quarantine.storage
            public: true
        test.storage.documents:
            alias: documents.storage
            public: true
        App\Shared\Application\Security\HumanVerification:
            class: App\Tests\Support\Fake\AcceptingHumanVerification
        # Limites de débit : stockage en mémoire non réinitialisé entre requêtes (comme Redis en production) mais propre
        # à chaque noyau de test (isolation entre tests, cf. bf78dc0).
        cache.rate_limiter:
            class: Symfony\Component\Cache\Adapter\ArrayAdapter
        App\Shared\Application\Integration\CompanyRegistry:
            class: App\Tests\Support\Fake\FakeCompanyRegistry
        App\Billing\Application\Port\VatNumberChecker:
            class: App\Tests\Support\Fake\FakeVatNumberChecker
        App\Catalog\Application\Geo\Port\AddressGeocoder:
            class: App\Tests\Support\Fake\FakeAddressGeocoder
        # Antivirus de test (reconnaît la chaîne EICAR) ; ClamAvScanner réel couvert par ClamAvScannerTest.
        App\Shared\Application\Storage\Port\AntivirusScanner:
            class: App\Tests\Support\Fake\EicarAntivirusScanner
        # Clients sortants inspectés par ExternalHttpClientsTest (anti-SSRF).
        test.geo_api.client:
            alias: geo_api.client
            public: true
        test.geocoding.client:
            alias: geocoding.client
            public: true
        test.sirene.client:
            alias: sirene.client
            public: true
        test.vies.client:
            alias: vies.client
            public: true
