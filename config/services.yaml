            - '../src/Quote/Application/Revision/RevisionPreview.php'
            - '../src/Quote/Application/Pro/{ProQuoteFilter,ProQuoteRow,ProQuotesPage,ProDashboardView}.php'
            - '../src/Quote/Application/Admin/{AdminQuoteRow,AdminQuotesPage}.php'
            - '../src/Billing/Application/Plan/PlanView.php'
