# Annexe F — déclencheurs de notification (codes, destinataires, canaux par défaut).
# Chargé en base par `bin/console app:notification:sync` : ajoute les entrées manquantes, ne remplace jamais un
# modèle modifié en back-office (BO11). Contenu par défaut : config/notification/defaults/<code>.{subject,html,txt,in_app}.twig
# (syntaxe Twig en bac à sable). `variables` : données fournies par le module émetteur.
# SMS (canal « sms ») : lot V2 — ignoré tant qu'aucun fournisseur n'est configuré.
notifications:
    'E-01':
        label: "Inscription : validation de l'adresse email"
        recipient: "Client / artisan"
        channels: [email]
        variables: [prenom, lien, validite_heures, changement_adresse]
    'E-02':
        label: "Bienvenue client (après validation)"
        recipient: "Client"
        channels: [email]
    'E-03':
        label: "Lien de réinitialisation du mot de passe"
        recipient: "Tous"
        channels: [email]
        variables: [prenom, lien, validite_minutes]
    'E-04':
        label: "Mot de passe modifié"
        recipient: "Tous"
        channels: [email, in_app]
        variables: [prenom, date, lien_reinitialisation, lien_aide]
    'E-05':
        label: "Connexion depuis un nouvel appareil"
        recipient: "Tous"
        channels: [email]
        variables: [prenom, appareil, date, lien_reinitialisation]
    'E-06':
        label: "Changement d'adresse email (alerte à l'ancienne)"
        recipient: "Tous"
        channels: [email]
        variables: [prenom, date, lien_aide]
    'E-07':
        label: "Export de données prêt"
        recipient: "Tous"
        channels: [email]
    'E-08':
        label: "Demande de suppression de compte enregistrée"
        recipient: "Tous"
        channels: [email]
    'E-09':
        label: "Suppression de compte effective"
        recipient: "Tous"
        channels: [email]
    'E-10':
