        recipient: "Client"
        channels: [email, in_app]
        variables: [prenom, numero, demande, montant, artisan, artisan_email, artisan_telephone, lien]
    'E-14':
        label: "RDV proposé / confirmé / reporté / annulé par l'artisan"
