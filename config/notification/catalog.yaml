        recipient: "Client"
        channels: [email, in_app]
        variables: [prenom, numero, metier, ville, max_devis, lien]
    'E-10b':
        label: "Demande mise en modération / refusée"
        recipient: "Client"
        channels: [email, in_app]
        variables: [prenom, numero, metier, refusee, motif, lien_aide]
    'E-11':
        label: "Compte créé lors du dépôt (activation)"
        recipient: "Client"
        channels: [email]
        variables: [prenom, lien, validite_heures, changement_adresse, sans_mot_de_passe]
    'E-12':
        label: "Nouveau devis reçu"
        recipient: "Client"
        channels: [email, in_app, sms]
        variables: [prenom, artisan, numero, metier, montant, validite, lien, rappel]
