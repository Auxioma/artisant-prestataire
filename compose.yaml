# Environnement de développement TrouveMoi (cadrage §3). Versions d'images figées ; digests à figer avant prod (T-906).
# Démarrage : docker compose up -d --wait ; puis docker compose exec php bin/console doctrine:migrations:migrate
name: trouvemoi

x-app: &app
  image: trouvemoi-app:dev
  build: { context: ., target: dev }
  volumes:
    - ./:/app
  environment:
    SERVER_NAME: ':80'
    DATABASE_URL: postgresql://trouvemoi:trouvemoi@database:5432/trouvemoi?serverVersion=16&charset=utf8
    MESSENGER_TRANSPORT_DSN: redis://redis:6379
    REDIS_URL: redis://redis:6379
    # Liens absolus des e-mails (générés par le worker, hors requête HTTP) : ouvrables depuis Mailpit sur le Mac
    DEFAULT_URI: http://localhost:${TM_HTTP_PORT:-8090}
    MEILISEARCH_URL: http://meilisearch:7700
    # Dev uniquement : la clé maître sert aux deux usages. En prod, clés dédiées (recherche / administration) via secrets.
    MEILISEARCH_SEARCH_KEY: trouvemoi-dev-master-key
    MEILISEARCH_ADMIN_KEY: trouvemoi-dev-master-key
    CLAMAV_DSN: tcp://clamav:3310
    S3_ENDPOINT: http://s3:8333
    S3_ACCESS_KEY: trouvemoi
    S3_SECRET_KEY: trouvemoi-dev-secret
  depends_on:
    database: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  php:
    restart: unless-stopped   # relance après un redémarrage du serveur (incident 502 du 24/11)
    <<: *app
    ports: ['${TM_HTTP_PORT:-8090}:80']
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost/healthz']
      interval: 10s
      retries: 5

  worker:
    <<: *app
    healthcheck: { disable: true }   # pas de serveur HTTP : la sonde héritée de l'image ne s'applique pas
    command: ['php', 'bin/console', 'messenger:consume', 'async_priority', 'stripe_webhooks', 'async', 'file_scan', 'search_index', '--time-limit=3600', '--memory-limit=256M', '-vv']
    restart: unless-stopped

  outbox-relay:
    <<: *app
    healthcheck: { disable: true }   # pas de serveur HTTP : la sonde héritée de l'image ne s'applique pas
    command: ['php', 'bin/console', 'app:outbox:relay', '-v']
    restart: unless-stopped

  scheduler:
    <<: *app
    healthcheck: { disable: true }   # pas de serveur HTTP : la sonde héritée de l'image ne s'applique pas
    command: ['php', 'bin/console', 'messenger:consume', 'scheduler_default', '--time-limit=3600', '-vv']
    restart: unless-stopped

  database:
    restart: unless-stopped   # relance après un redémarrage du serveur (incident 502 du 24/11)
    image: imresamu/postgis:16-3.5-alpine  # multi-arch (amd64 + arm64) ; postgis/postgis n'a pas d'arm64
    environment:
      POSTGRES_DB: trouvemoi
      POSTGRES_USER: trouvemoi
      POSTGRES_PASSWORD: trouvemoi
    healthcheck:
      test: ['CMD', 'pg_isready', '-d', 'trouvemoi', '-U', 'trouvemoi']
      interval: 5s
      retries: 10
    volumes:
      - database_data:/var/lib/postgresql/data

  redis:
    restart: unless-stopped   # relance après un redémarrage du serveur (incident 502 du 24/11)
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
    volumes:
      - redis_data:/data

  meilisearch:
    restart: unless-stopped   # relance après un redémarrage du serveur (incident 502 du 24/11)
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: trouvemoi-dev-master-key
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      - meili_data:/meili_data

  clamav:
    restart: unless-stopped   # relance après un redémarrage du serveur (incident 502 du 24/11)
    image: clamav/clamav-debian:1.4  # variante Debian : amd64 + arm64
    volumes:
      - clamav_data:/var/lib/clamav

  mailer:
    restart: unless-stopped   # relance après un redémarrage du serveur (incident 502 du 24/11)
    image: axllent/mailpit:v1.21
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Stockage objet S3 privé de développement (SeaweedFS ; les images MinIO ne sont plus publiées sur Docker Hub).
  s3:
    restart: unless-stopped   # relance après un redémarrage du serveur (incident 502 du 24/11)
    image: chrislusf/seaweedfs:3.80
    command: ['server', '-s3', '-s3.config=/etc/seaweedfs/s3.json', '-dir=/data']
    volumes:
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - s3_data:/data

volumes:
  database_data:
  redis_data:
  meili_data:
  clamav_data:
  s3_data:
