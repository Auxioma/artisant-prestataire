# Diagnostic en lecture seule du serveur trouvemoi.pro, pour ajuster le déploiement sans accès direct au serveur.
# Dépôt public : le journal est lisible par tous → uniquement des présences, versions et états (jamais de contenu
# de configuration, de mot de passe ni d'adresse). Lancement : automatique quand ce fichier change, ou Actions › Run.
name: Diagnostic serveur

on:
  workflow_dispatch:
  push:
    branches: [gafour, main]
    paths: ['.github/workflows/diagnostic-serveur.yaml', 'tools/deploy/**']

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Secrets du dépôt ET de l'environnement « production » (ces derniers ne sont visibles que si le job le déclare).
    environment: production
    env:
      SECRETS_JSON: ${{ toJSON(secrets) }}
      SITE_DIR: ${{ vars.DEPLOY_PATH || '/var/www/vhosts/trouvemoi.pro/httpdocs' }}
    steps:
      - uses: actions/checkout@v4

      - name: Accès SSH (secrets du dépôt)
        id: ssh
        run: bash tools/deploy/ssh-from-secrets.sh

      - name: État du serveur
        if: steps.ssh.outputs.ready == 'true'
        run: |
          $SSH "SITE_DIR='$SITE_DIR' bash -s" << 'EOF'
            s() { echo; echo "===== $1 ====="; }
            yn() { [ -e "$1" ] && echo "oui" || echo "non"; }
            s "Compte SSH"
            [ "$(id -u)" = 0 ] && echo "root" || echo "non root (uid $(id -u))"; sudo -n true 2>/dev/null && echo "sudo sans mot de passe : oui" || echo "sudo sans mot de passe : non"
            s "Sites Plesk"
            ls /var/www/vhosts 2>/dev/null | grep -v -E '^(system|default|chroot|fs|fs-passwd)$'
            s "httpdocs trouvemoi.pro"
            if [ -d "$SITE_DIR" ]; then
              cd "$SITE_DIR"
              echo "propriétaire : $(stat -c '%U:%G' .)"
              for f in .git bin/console public/index.php vendor/autoload.php .env.local .env.local.php composer.json tools/deploy/production-remote.sh var .vscode; do printf '%-36s %s\n' "$f" "$(yn $f)"; done
              [ -d .git ] && git log -1 --format='commit déployé : %h %s' 2>/dev/null | cut -c1-100
              echo "fichiers appartenant à root : $(find . -path ./vendor -prune -o -user root -print 2>/dev/null | wc -l)"
            else
              echo "dossier absent"
            fi
            s "Outils"
            ls /opt/plesk/php 2>/dev/null | tr '\n' ' '; echo
            for t in git composer rsync curl python3 psql redis-cli; do printf '%-10s %s\n' $t "$(command -v $t >/dev/null && echo présent || echo absent)"; done
            [ -f /usr/local/psa/var/modules/composer/composer.phar ] && echo "composer Plesk : présent"
            s "Services"
            systemctl list-units --type=service --all --no-legend 2>/dev/null | awk '{print $1, $3, $4}' | grep -iE 'trouvemoi|messenger|worker|outbox|scheduler|meili|redis|seaweed|clamav|postgres|php.*fpm|supervisor' 
            ls /etc/supervisor/conf.d 2>/dev/null
            echo "tâches cron mentionnant bin/console : $(cat /etc/cron.d/* /var/spool/cron/crontabs/* 2>/dev/null | grep -c 'bin/console' || true)"
            s "Dépendances réseau locales"
            curl -fsS -m 3 http://127.0.0.1:7700/health 2>/dev/null && echo || echo "Meilisearch 127.0.0.1:7700 : injoignable"
            command -v redis-cli >/dev/null && redis-cli ping 2>/dev/null
          EOF

      - name: Application (sous l'utilisateur du site)
        if: steps.ssh.outputs.ready == 'true'
        run: |
          $SSH "cd '$SITE_DIR' 2>/dev/null || exit 0; u=\$(stat -c %U .); if [ \$(id -u) = 0 ]; then sudo -u \$u -H bash -s; else bash -s; fi" << 'EOF'
            s() { echo; echo "===== $1 ====="; }
            for v in $(ls /opt/plesk/php 2>/dev/null | sort -rV); do [ -x /opt/plesk/php/$v/bin/php ] && { export PATH=/opt/plesk/php/$v/bin:$PATH; break; }; done
            export APP_ENV=prod APP_DEBUG=0
            s "PHP"
            php -r 'echo PHP_VERSION, PHP_EOL;'
            for e in intl pdo_pgsql redis sodium zip gd exif apcu; do printf '%-10s %s\n' $e "$(php -m | grep -qix $e && echo oui || echo NON)"; done
            [ -f bin/console ] || exit 0
            s "Symfony"
            php -d memory_limit=512M bin/console --version 2>&1 | tail -1
            s "Migrations"
            php -d memory_limit=512M bin/console doctrine:migrations:up-to-date --no-interaction 2>&1 | grep -vE 'postgres(ql)?://' | tail -3
            s "Accueil"
            curl -s -o /dev/null -w 'https://trouvemoi.pro/ → %{http_code}\n' https://trouvemoi.pro/
            curl -s -o /dev/null -w '/healthz → %{http_code}\n' https://trouvemoi.pro/healthz
          EOF

      - name: Nettoyage
        if: always()
        run: rm -f ~/.ssh/deploy_key
