# Definition of Done (cadrage §7) : tests, PHPStan max, Deptrac, CS, composer audit, gitleaks — le build échoue sinon.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualité et tests
    runs-on: ubuntu-24.04
    services:
      database:
        image: imresamu/postgis:16-3.5-alpine
        env:
          POSTGRES_DB: trouvemoi
          POSTGRES_USER: trouvemoi
          POSTGRES_PASSWORD: trouvemoi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trouvemoi" --health-interval 5s --health-timeout 5s --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.12
        env:
          MEILI_MASTER_KEY: ci-master-key-not-secret
          MEILI_NO_ANALYTICS: 'true'
        ports: ['7700:7700']
    env:
      DATABASE_URL: postgresql://trouvemoi:trouvemoi@127.0.0.1:5432/trouvemoi?serverVersion=16&charset=utf8
      MEILISEARCH_URL: http://127.0.0.1:7700
      MEILISEARCH_SEARCH_KEY: ci-master-key-not-secret
      MEILISEARCH_ADMIN_KEY: ci-master-key-not-secret
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, sodium, zip, apcu, gd, exif
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Audit des dépendances
        run: composer audit --locked

      - name: Style (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Lints Symfony
        run: |
          php bin/console lint:container
          php bin/console lint:yaml config --parse-tags
          php bin/console lint:twig templates
          php bin/console doctrine:schema:validate --skip-sync

      - name: Migrations réversibles (up → first → up)
        run: |
          php bin/console doctrine:database:create --if-not-exists --env=test
          php bin/console doctrine:migrations:migrate -n --env=test
          php bin/console doctrine:migrations:migrate first -n --env=test
          php bin/console doctrine:migrations:migrate -n --env=test
          php bin/console doctrine:migrations:up-to-date --env=test
          php bin/console app:notification:sync --env=test

      - name: PHPStan (niveau max)
        run: |
          php bin/console cache:warmup --env=dev
          vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Deptrac (couches et modules)
        run: |
          vendor/bin/deptrac analyse --config-file=deptrac.layers.yaml --no-progress
          vendor/bin/deptrac analyse --config-file=deptrac.modules.yaml --no-progress

      - name: Tests (unitaires, intégration, fonctionnels)
        run: vendor/bin/phpunit

  secrets:
    name: Analyse de secrets (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose --log-opts=HEAD

  # Mise en production sur trouvemoi.pro (serveur Plesk du client) après fusion dans main, une fois la qualité validée.
  # Environnement GitHub « production » : secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS ;
  # variables DEPLOY_PATH, DEPLOY_PORT, DEPLOY_OWNER, DEPLOY_PHP, DEPLOY_RESTART, DEPLOY_URL (voir docs/exploitation.md).
  deploy:
    name: Déploiement trouvemoi.pro
    needs: [quality, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL || 'https://trouvemoi.pro' }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/vhosts/trouvemoi.pro/httpdocs' }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL || 'https://trouvemoi.pro' }}
    steps:
      - name: Configuration présente ?
        id: config
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ]; then
            echo "::warning::Secrets DEPLOY_HOST / DEPLOY_USER absents de l'environnement « production » : déploiement ignoré."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'

      - name: Garde-fou (aucun fichier piégé)
        if: steps.config.outputs.ready == 'true'
        run: |
          if [ -d .vscode ] || git grep -qI -e createRequire -- assets templates config public; then
            echo "::error::Fichiers suspects (.vscode/ ou createRequire) : déploiement refusé."; exit 1
          fi

      - uses: shivammathur/setup-php@v2
        if: steps.config.outputs.ready == 'true'
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, sodium, zip, apcu, gd, exif
          coverage: none
          tools: composer:v2

      - name: Dépendances de production
        if: steps.config.outputs.ready == 'true'
        run: |
          composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader --classmap-authoritative --no-scripts
          git rev-parse --short HEAD > REVISION

      - name: Clé SSH
        if: steps.config.outputs.ready == 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Copie du code (fichiers du serveur préservés)
        if: steps.config.outputs.ready == 'true'
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT -o StrictHostKeyChecking=yes" \
            --filter='P /.env.local' --filter='P /.env.local.php' --filter='P /.env.*.local' \
            --filter='P /var/' --filter='P /public/assets/' --filter='P /public/bundles/' --filter='P /assets/vendor/' \
            --filter='P /config/secrets/*/*.decrypt.private.php' --filter='P /public/.well-known/' --filter='P /.well-known/' \
            --filter='P /.user.ini' --filter='P /public/.user.ini' --filter='P /public/.htaccess' --filter='P /.git/' \
            --exclude=/.git/ --exclude=/.github/ --exclude=/.vscode/ --exclude=/tests/ --exclude=/docs/ \
            --exclude=/var/ --exclude=/public/assets/ --exclude=/assets/vendor/ --exclude='/compose*.yaml' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Mise en production (cache, assets, migrations, synchronisations, workers)
        if: steps.config.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PHP='${{ vars.DEPLOY_PHP }}' DEPLOY_OWNER='${{ vars.DEPLOY_OWNER }}' DEPLOY_RESTART='${{ vars.DEPLOY_RESTART }}' bash '$DEPLOY_PATH/tools/deploy/production-remote.sh'"

      - name: Vérification en ligne
        if: steps.config.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5; do curl -fsS "$DEPLOY_URL/healthz" >/dev/null && curl -fsS -o /dev/null "$DEPLOY_URL/" && { echo "✓ $DEPLOY_URL en ligne ($(cat REVISION))"; exit 0; }; sleep 5; done
          echo "::error::$DEPLOY_URL ne répond pas après déploiement"; exit 1

      - name: Nettoyage de la clé
        if: always()
        run: rm -f ~/.ssh/deploy_key
